# Paste this at https://api.slack.com/apps → Create New App → From a manifest
display_information:
  name: FTT Support
  description: Support tickets & customer success KPIs for Freedom Team Trading
  background_color: "#1a1a2e"
features:
  bot_user:
    display_name: FTT Support
    always_online: true
  slash_commands:
    - command: /ticket
      description: Open a support ticket
      usage_hint: ""
      should_escape: false
    - command: /kpis
      description: Customer success KPI report
      usage_hint: "[days, default 7]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - reactions:read
      - channels:history
      - groups:history
      - im:history
      - im:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
